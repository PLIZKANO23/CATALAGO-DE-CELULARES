<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Teléfonos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-pink sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="#">📱 PhoneStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-dark fw-semibold" href="#catalogo">Catálogo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark fw-semibold" href="#contacto">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Header / Banner -->
    <header class="hero-section text-center py-5 mb-5 shadow-sm">
        <div class="container">
            <h1 class="display-4 fw-bold text-dark">Encuentra tu próximo teléfono</h1>
            <p class="lead text-secondary">Los mejores smartphones con tecnología de punta y diseños increíbles.</p>
            <a href="#catalogo" class="btn btn-custom-yellow btn-lg mt-3 fw-bold shadow">Ver Catálogo</a>
        </div>
    </header>

    <!-- Catálogo de Productos -->
    <main class="container mb-5" id="catalogo">
        <h2 class="text-center mb-4 fw-bold text-dark">Nuestros Modelos</h2>
        
        <!-- Buscador -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar teléfono por nombre...">
            </div>
        </div>

        <!-- Contenedor donde JS cargará las tarjetas de productos -->
        <div class="row row-cols-1 row-cols-md-3 g-4" id="product-container">
            <!-- Los productos se inyectarán dinámicamente mediante JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer id="contacto" class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-1">&copy; 2026 PhoneStore. Todos los derechos reservados.</p>
            <p class="small text-muted">Contáctanos: ventas@phonestore.com | Tel: +57 300 123 4567</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script personalizado -->
    <script src="js/main.js"></script>
</body>
</html>
